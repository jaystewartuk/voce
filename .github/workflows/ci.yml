name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Smoke test the command
        run: |
          voce --version
          voce --check README.md docs/playlists.md

  web:
    name: Web app · Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The web app against a fake GitHub
        working-directory: tests/web
        env:
          VOCE_PYTHON: python
        run: npx playwright test
