<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;background:#0E1116;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.wrap{padding:64px 80px;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:20px;font:700 52px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-2px}
.brand img{width:80px;height:80px}
h1{font-size:68px;line-height:1.15;letter-spacing:-2.5px;margin:40px 0 0;font-weight:750}
.said{background:#AFD7FF;color:#0E1116;padding:0 10px;border-radius:8px}
.said b{background:#2F6FEB;color:#fff;padding:0 8px;border-radius:7px;font-weight:inherit}
.line{margin-top:44px;display:flex;align-items:center;gap:28px;font-size:38px}
.line code{font:600 38px ui-monospace,"SF Mono",Menlo,monospace;background:#161B22;border:1px solid #30363D;border-radius:12px;padding:14px 22px}
.s{color:#A5D6FF}.o{color:#FF7B72}.n{color:#79C0FF}
.arrow{color:#6E7681}
.hear{color:#E6EDF3}
.hear i{font-style:normal;color:#6CA4F8}
.foot{margin-top:auto;font:26px ui-monospace,"SF Mono",Menlo,monospace;color:#6CA4F8}
</style></head><body><div class="wrap">
<div class="brand"><img src="../logo.svg">voce</div>
<h1>Code, read aloud,<br><span class="said">the way a <b>person</b> says it</span>.</h1>
<div class="line"><code><span class="s">'1'</span> <span class="o">===</span> <span class="n">1</span></code><span class="arrow">→</span>
<span class="hear">“the string 1 <i>is identical to</i> 1”</span></div>
<div class="foot">$ voce notes.md &nbsp;·&nbsp; 13 languages &nbsp;·&nbsp; free, on your computer</div>
</div></body></html>
