[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voce"
dynamic = ["version"]
description = "Read Markdown aloud in your terminal, highlighting each sentence and word as it is spoken. Reads code the way a pairing partner says it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jay Stewart" }]
keywords = ["text-to-speech", "tts", "markdown", "terminal", "read-aloud", "curses", "claude-code", "macos", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pygments>=2.12",
    # Kokoro, the voice that works out of the box. It needs Python 3.10; on 3.9 voce uses the Mac's voices.
    "kokoro-onnx>=0.4.5; python_version >= '3.10' and python_version < '3.14'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
voce = "voce.cli:main"

[project.urls]
Homepage = "https://github.com/jaystewartuk/voce"
Issues = "https://github.com/jaystewartuk/voce/issues"
Changelog = "https://github.com/jaystewartuk/voce/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/voce/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/assets/*.gif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]
